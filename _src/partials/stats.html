<section class="section--tight tex-dots">
      <!-- PLACEHOLDER figures: confirm all four numbers with Lumigrid before launch -->
      <div class="container stats">
        <div class="stat" data-reveal><span class="pat pat--cells pat--br" style="--pc:var(--amber-3);--pw:58%;--po:.22" aria-hidden="true"></span><p class="stat__n"><span data-count="5">0</span><sup>+</sup></p><p class="stat__l">Years of experience</p></div>
        <div class="stat" data-reveal style="--d:.08s"><span class="pat pat--plus pat--br" style="--pc:var(--sky-3);--pw:58%;--po:.22" aria-hidden="true"></span><p class="stat__n"><span data-count="350">0</span><sup>+</sup></p><p class="stat__l">Systems installed</p></div>
        <div class="stat" data-reveal style="--d:.16s"><span class="pat pat--rays pat--br" style="--pc:var(--amber-3);--pw:58%;--po:.22" aria-hidden="true"></span><p class="stat__n"><span data-count="1.2">0</span><sup>MW</sup></p><p class="stat__l">Solar installed</p></div>
        <div class="stat" data-reveal style="--d:.24s"><span class="pat pat--rings pat--br" style="--pc:var(--sky-3);--pw:58%;--po:.22" aria-hidden="true"></span><p class="stat__n"><span data-count="80">0</span><sup>%</sup></p><p class="stat__l">Typical savings</p></div>
      </div>
    </section>
